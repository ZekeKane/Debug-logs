<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KE's 3D Virtual Room</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-color: #FFE3B3; 
            --bg-base: #030307; 
            --gh-text-main: #ffffff;
            --gh-text-muted: #8b949e;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Poppins', -apple-system, sans-serif;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            overflow: hidden; background-color: #9eabae; 
            font-family: var(--font-sans);
        }

        #canvas-container {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
        }

        #gallery-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 3, 7, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 100; display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transform: scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        #gallery-overlay.active {
            opacity: 1; pointer-events: auto; transform: scale(1);
        }

        .gallery-header {
            height: 70px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .gallery-title {
            color: var(--gh-text-main); font-size: 1.2rem; font-weight: 600; letter-spacing: 2px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05); border: none; color: white;
            padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: var(--font-mono);
            transition: all 0.3s ease;
        }
        .close-btn:hover { background: var(--accent-color); color: black; }

        .gallery-viewport {
            flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth;
        }

        .gallery-viewport::-webkit-scrollbar { width: 0px; }

        .image-stream {
            display: flex; flex-direction: column; align-items: center; gap: 40px; max-width: 1200px; margin: 0 auto;
        }

        .gallery-card {
            width: 100%; background: rgba(255, 255, 255, 0.02); border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .gallery-card img { width: 100%; height: auto; display: block; }

        .loader-text {
            color: var(--gh-text-muted); font-family: var(--font-mono); text-align: center; margin-top: 20vh; font-size: 1.2rem;
        }

        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; 
            background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="crosshair"></div>

    <div id="gallery-overlay">
        <div class="gallery-header">
            <div class="gallery-title" id="gallery-title">PROJECT FOLDER</div>
            <button class="close-btn" onclick="closeGallery()">CLOSE VIRTUAL FOLDER X</button>
        </div>
        <div class="gallery-viewport" id="galleryViewport">
            <div class="image-stream" id="imageStream">
                <div class="loader-text">Extracting files from dimensional storage...</div>
            </div>
        </div>
    </div>

    <script>
        const IMAGE_EXTENSIONS = ['.jpg', '.png', '.jpeg', '.webp', '.JPG', '.PNG'];
        const MAX_IMAGES_PER_FOLDER = 99;
        const projectImageCache = {};
        let currentLoadSession = 0;

        const interactiveTargets = [
            { id: "e_mp", title: "E_MP DESIGN", path: "images/Transportation/E_MP", fallback: "images/E_MP", color: "#000000" },
            { id: "vehicle", title: "VEHICLES", path: "images/Transportation/Vehicle_researches/Works", fallback: "images/Vehicle_researches/Works", color: "#007aff" },
            { id: "aircraft", title: "AIRCRAFT", path: "images/Transportation/Aircraft_Researches/Aircraft_works", fallback: "images/Aircraft_Researches/Aircraft_works", color: "#34c759" },
            { id: "clay", title: "CLAY BMW", path: "images/Transportation/Clay_Bmw_Gen12/Works", fallback: "images/Clay_Bmw_Gen12/Works", color: "#ff3b30" },
            { id: "modeling", title: "3D MODELS", path: "images/Discoveries/Skills/Modeling_Work", fallback: "images/Skills/Modeling_Work", color: "#5856d6" },
            { id: "slide", title: "SLIDES", path: "images/Transportation/E_MP/Slide", fallback: "images/E_MP/Slide", color: "#ff9500" }
        ];

        let scene, camera, renderer, controls, raycaster, mouse;
        let interactableObjects = [];

        function init3DScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdce0e5); 
            scene.fog = new THREE.Fog(0xdce0e5, 4, 20);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.set(0.2, 1.3, 3.8); 

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false; 
            controls.minDistance = 1;
            controls.maxDistance = 6;
            controls.minPolarAngle = Math.PI / 3; 
            controls.maxPolarAngle = Math.PI / 1.7;
            controls.target.set(-0.5, 1.1, 0);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xc0c5c9, 0.7);
            scene.add(hemiLight);

            const windowLight = new THREE.DirectionalLight(0xffffff, 0.45);
            windowLight.position.set(8, 5, 2);
            windowLight.castShadow = true;
            windowLight.shadow.mapSize.width = 2048;
            windowLight.shadow.mapSize.height = 2048;
            windowLight.shadow.camera.near = 0.5;
            windowLight.shadow.camera.far = 20;
            windowLight.shadow.camera.left = -6;
            windowLight.shadow.camera.right = 6;
            windowLight.shadow.camera.top = 6;
            windowLight.shadow.camera.bottom = -6;
            windowLight.shadow.bias = -0.001;
            scene.add(windowLight);

            const fillLight = new THREE.PointLight(0xffeedd, 0.2, 8);
            fillLight.position.set(-2, 1.5, 2);
            scene.add(fillLight);

            buildRoomGeometry();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('click', onClick);

            animate();
        }

        function buildRoomGeometry() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x98a1a4, roughness: 0.95 });
            const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.8 });
            const shelfWoodMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
            const shelfGoldMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, roughness: 0.3, metalness: 0.7 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xfcfcfc, roughness: 0.8, metalness: 0.0 });

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0xc9cdce, roughness: 1.0 }));
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const rug = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 4.5), new THREE.MeshStandardMaterial({ color: 0xdfdfdf, roughness: 1.0 }));
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0.5, 0.01, 0.5);
            rug.receiveShadow = true;
            scene.add(rug);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
            backWall.position.set(0, 2.5, -2.5);
            backWall.receiveShadow = true;
            scene.add(backWall);

            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-4.5, 2.5, 0);
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 1.0 }));
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, 3.5, 0);
            scene.add(ceiling);

            const outside = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshBasicMaterial({ color: 0xe8ecef }));
            outside.rotation.y = -Math.PI / 2;
            outside.position.set(6, 2.5, 0);
            scene.add(outside);

            const sheer = new THREE.Mesh(new THREE.PlaneGeometry(8, 3.4), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.65, roughness: 1.0, side: THREE.DoubleSide }));
            sheer.rotation.y = -Math.PI / 2;
            sheer.position.set(4.3, 1.7, 0);
            scene.add(sheer);

            const curtainMat = new THREE.MeshStandardMaterial({ color: 0x6e7174, roughness: 0.95 });
            const leftCurtain = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 1.2), curtainMat);
            leftCurtain.position.set(4.2, 1.7, -3.4);
            leftCurtain.castShadow = true;
            scene.add(leftCurtain);
            const rightCurtain = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 1.2), curtainMat);
            rightCurtain.position.set(4.2, 1.7, 3.4);
            rightCurtain.castShadow = true;
            scene.add(rightCurtain);

            const chandelierBase = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1), darkMetalMat);
            chandelierBase.position.set(1.5, 3.45, 1);
            scene.add(chandelierBase);
            const chandelierRod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.3), darkMetalMat);
            chandelierRod.position.set(1.5, 3.3, 1);
            scene.add(chandelierRod);
            const chandelierCenter = new THREE.Mesh(new THREE.SphereGeometry(0.06), darkMetalMat);
            chandelierCenter.position.set(1.5, 3.15, 1);
            scene.add(chandelierCenter);

            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            for(let i=0; i<6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.4), darkMetalMat);
                arm.rotation.z = Math.PI / 2;
                arm.rotation.y = angle;
                arm.position.set(1.5 + Math.cos(angle)*0.2, 3.15 + (i%2===0?0.05:-0.05), 1 + Math.sin(angle)*0.2);
                scene.add(arm);
                
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05), bulbMat);
                bulb.position.set(1.5 + Math.cos(angle)*0.4, 3.15 + (i%2===0?0.05:-0.05), 1 + Math.sin(angle)*0.4);
                scene.add(bulb);
            }
            const ceilingLight = new THREE.PointLight(0xfffaed, 0.2, 8);
            ceilingLight.position.set(1.5, 3.1, 1);
            scene.add(ceilingLight);

            const floorLampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.02), darkMetalMat);
            floorLampBase.position.set(3.5, 0.01, -2.1);
            scene.add(floorLampBase);
            const floorLampRod = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.6), darkMetalMat);
            floorLampRod.position.set(3.5, 0.8, -2.1);
            scene.add(floorLampRod);
            const floorLampLight = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.8), bulbMat);
            floorLampLight.position.set(3.5, 1.2, -2.08);
            scene.add(floorLampLight);
            const fLight = new THREE.PointLight(0xffeedd, 0.15, 4);
            fLight.position.set(3.5, 1.2, -2.0);
            scene.add(fLight);

            const cabinet = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.5, 0.5), whiteMat);
            cabinet.position.set(-0.8, 0.25, -2.2);
            cabinet.castShadow = true; cabinet.receiveShadow = true;
            scene.add(cabinet);
            const cabGap1 = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.48, 0.51), darkMetalMat);
            cabGap1.position.set(-1.4, 0.25, -2.2);
            scene.add(cabGap1);
            const cabGap2 = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.48, 0.51), darkMetalMat);
            cabGap2.position.set(-0.2, 0.25, -2.2);
            scene.add(cabGap2);

            const soundbar = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.1), darkMetalMat);
            soundbar.position.set(-0.8, 0.53, -2.05);
            soundbar.castShadow = true;
            scene.add(soundbar);

            const subwoofer = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.45), darkMetalMat);
            subwoofer.position.set(-2.8, 0.25, -2.1);
            subwoofer.castShadow = true; subwoofer.receiveShadow = true;
            scene.add(subwoofer);

            const leftCol = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.8, 0.6), shelfGoldMat);
            leftCol.position.set(-3.8, 1.4, -2.0);
            leftCol.castShadow = true; leftCol.receiveShadow = true;
            scene.add(leftCol);
            const rightCol = leftCol.clone();
            rightCol.position.x = -2.6;
            scene.add(rightCol);
            
            for(let i=0; i<5; i++) {
                const board = new THREE.Mesh(new THREE.BoxGeometry(1.28, 0.04, 0.58), shelfWoodMat);
                board.position.set(-3.2, 0.3 + i*0.6, -2.0);
                board.castShadow = true; board.receiveShadow = true;
                scene.add(board);
            }

            const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.15), new THREE.MeshStandardMaterial({ color: 0xdcd0c0 }));
            pot.position.set(-1.8, 0.575, -2.1);
            pot.castShadow = true; scene.add(pot);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e4233 });
            for(let i=0; i<5; i++) {
                const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.3), leafMat);
                leaf.position.set(-1.8 + (Math.random()-0.5)*0.05, 0.75, -2.1 + (Math.random()-0.5)*0.05);
                leaf.rotation.set((Math.random()-0.5)*0.5, Math.random()*Math.PI, (Math.random()-0.5)*0.5);
                leaf.castShadow = true; scene.add(leaf);
            }

            const bookColors = [0x222222, 0x555555, 0x888888, 0xd0d0d0];
            for(let b=0; b<12; b++) {
                const bw = 0.04 + Math.random()*0.02;
                const bh = 0.2 + Math.random()*0.1;
                const bd = 0.15 + Math.random()*0.05;
                const bookMat = new THREE.MeshStandardMaterial({ color: bookColors[Math.floor(Math.random()*bookColors.length)] });
                const book = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bookMat);
                
                const shelfIdx = Math.floor(Math.random() * 4);
                const basex = -3.5 + Math.random()*0.6;
                const basey = 0.32 + shelfIdx*0.6 + bh/2;
                book.position.set(basex, basey, -2.0);
                if(Math.random() > 0.8) {
                    book.rotation.z = (Math.random()-0.5)*0.4; 
                }
                book.castShadow = true;
                scene.add(book);
            }

            const decorBox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), whiteMat);
            decorBox.position.set(-3.0, 0.9 + 0.075, -2.0);
            decorBox.castShadow = true; scene.add(decorBox);
            
            const decorSphereGeo = new THREE.IcosahedronGeometry(0.1, 0);
            const decorSphere = new THREE.Mesh(decorSphereGeo, shelfGoldMat);
            decorSphere.position.set(-3.3, 1.5 + 0.1, -2.0);
            decorSphere.castShadow = true; scene.add(decorSphere);

            const sofaMat = new THREE.MeshStandardMaterial({ color: 0x7a7c7e, roughness: 0.95 });
            const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 2.5), sofaMat);
            sofaBase.position.set(2.0, 0.2, 1);
            sofaBase.castShadow = true; sofaBase.receiveShadow = true;
            scene.add(sofaBase);
            const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 2.5), sofaMat);
            sofaBack.position.set(2.45, 0.6, 1);
            sofaBack.castShadow = true; sofaBack.receiveShadow = true;
            scene.add(sofaBack);
            const sofaChaise = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 1.5), sofaMat);
            sofaChaise.position.set(1.9, 0.2, -1.0);
            sofaChaise.castShadow = true; sofaChaise.receiveShadow = true;
            scene.add(sofaChaise);

            const pillowMat = new THREE.MeshStandardMaterial({ color: 0x5a5c5e, roughness: 1.0 });
            const pillow1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.15), pillowMat);
            pillow1.position.set(2.2, 0.5, 1.8);
            pillow1.rotation.set(0.2, -0.2, 0);
            pillow1.castShadow = true; scene.add(pillow1);
            const pillow2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.15), new THREE.MeshStandardMaterial({ color: 0xc9cdce }));
            pillow2.position.set(2.2, 0.5, 0.2);
            pillow2.rotation.set(0.1, 0.3, 0);
            pillow2.castShadow = true; scene.add(pillow2);

            const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.8), shelfWoodMat);
            tableTop.position.set(0.2, 0.45, 1.0);
            tableTop.castShadow = true; tableTop.receiveShadow = true;
            scene.add(tableTop);
            
            const tableLegs = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.9 });
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.45, 0.02), tableLegs);
            leg1.position.set(0.88, 0.225, 0.62); leg1.castShadow = true; scene.add(leg1);
            const leg2 = leg1.clone(); leg2.position.set(-0.48, 0.225, 0.62); scene.add(leg2);
            const leg3 = leg1.clone(); leg3.position.set(0.88, 0.225, 1.38); scene.add(leg3);
            const leg4 = leg1.clone(); leg4.position.set(-0.48, 0.225, 1.38); scene.add(leg4);
            const bottomMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.76), new THREE.MeshStandardMaterial({ color: 0x222222, transparent:true, opacity:0.8 }));
            bottomMesh.rotation.x = -Math.PI / 2;
            bottomMesh.position.set(0.2, 0.1, 1.0);
            scene.add(bottomMesh);

            const tray = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.4), darkMetalMat);
            tray.position.set(0.5, 0.48, 1.0);
            tray.castShadow = true; scene.add(tray);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.01, 0.35), whiteMat);
            mag.position.set(0.5, 0.495, 1.0);
            scene.add(mag);

            const tvGeo = new THREE.BoxGeometry(3.0, 1.7, 0.04);
            const tvMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.8 });
            const tv = new THREE.Mesh(tvGeo, tvMat);
            tv.position.set(-0.8, 1.6, -2.46);
            tv.castShadow = true;
            scene.add(tv);

            const screenGeo = new THREE.PlaneGeometry(2.9, 1.6);
            const screenMat = new THREE.MeshBasicMaterial({ color: 0x111625 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(-0.8, 1.6, -2.43);
            scene.add(screen);

            const startX = -1.8;
            const startY = 2.0;
            const gapX = 0.7;
            const gapY = 0.55;

            interactiveTargets.forEach((target, index) => {
                const col = index % 4;
                const row = Math.floor(index / 4);
                
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                const gradient = ctx.createLinearGradient(0, 0, 512, 256);
                gradient.addColorStop(0, target.color);
                gradient.addColorStop(1, '#1a1a1a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 256);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 45px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(target.title, 256, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const itemMat = new THREE.MeshBasicMaterial({ map: texture });
                const itemGeo = new THREE.PlaneGeometry(0.6, 0.35);
                const itemMesh = new THREE.Mesh(itemGeo, itemMat);

                itemMesh.position.set(startX + col * gapX, startY - row * gapY, -2.42);
                itemMesh.userData = { isInteractive: true, projectConfig: target };
                
                scene.add(itemMesh);
                interactableObjects.push(itemMesh);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                intersects[0].object.scale.set(1.05, 1.05, 1.05);
            } else {
                document.body.style.cursor = 'default';
                interactableObjects.forEach(obj => obj.scale.set(1, 1, 1));
            }
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const targetData = intersects[0].object.userData.projectConfig;
                openGallery(targetData);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        const galleryOverlay = document.getElementById('gallery-overlay');
        const imageStream = document.getElementById('imageStream');
        const galleryTitle = document.getElementById('gallery-title');

        function openGallery(projectData) {
            galleryOverlay.classList.add('active');
            galleryTitle.innerText = projectData.title + " // FILES EXTRACTED";
            imageStream.innerHTML = '<div class="loader-text">Extracting files from dimensional storage...</div>';
            
            document.getElementById('galleryViewport').scrollTo({ top: 0, behavior: 'instant' });

            currentLoadSession++;
            loadProjectImages(projectData, currentLoadSession);
        }

        function closeGallery() {
            galleryOverlay.classList.remove('active');
            setTimeout(() => { imageStream.innerHTML = ''; }, 400); 
        }

        async function loadProjectImages(projectObj, sessionToken) {
            const cacheKey = projectObj.path; 

            if (projectImageCache[cacheKey]) {
                const cachedUrls = projectImageCache[cacheKey];
                imageStream.innerHTML = '';
                cachedUrls.forEach((url, i) => {
                    const paddedNum = String(i + 1).padStart(2, '0');
                    renderImageCard(url, paddedNum);
                });
                return; 
            }

            let activeIndex = 1;
            const validUrls = []; 
            let retryCount = 0;
            const MAX_RETRIES = 2;

            let isFirstImage = true;

            while (activeIndex <= MAX_IMAGES_PER_FOLDER) {
                if (sessionToken !== currentLoadSession) return;

                const paddedNum = String(activeIndex).padStart(2, '0');
                let foundImage = await testImageSrc(projectObj.path, paddedNum, sessionToken);
                
                if (sessionToken !== currentLoadSession) return;

                if (!foundImage && projectObj.fallback) {
                    foundImage = await testImageSrc(projectObj.fallback, paddedNum, sessionToken);
                }
                
                if (sessionToken !== currentLoadSession) return;

                if (foundImage) {
                    if (isFirstImage) { imageStream.innerHTML = ''; isFirstImage = false; }
                    validUrls.push(foundImage); 
                    renderImageCard(foundImage, paddedNum);
                    activeIndex++;
                    retryCount = 0; 
                } else {
                    retryCount++;
                    if (retryCount > MAX_RETRIES) break; 
                    await new Promise(r => setTimeout(r, 800));
                }
            }

            if (validUrls.length > 0 && sessionToken === currentLoadSession) {
                projectImageCache[cacheKey] = validUrls;
            }

            if (activeIndex === 1 && sessionToken === currentLoadSession) {
                imageStream.innerHTML = `
                  <div class="loader-text" style="color:#ff4444">
                    [ERROR] NO SIGNAL DETECTED.<br><br>
                    <span style="font-size:0.8rem; color:#888;">Ensure images are named '01.png', '02.jpg' in the repository.</span>
                  </div>
                `;
            }
        }

        function testImageSrc(folderPath, num, sessionToken) {
            return new Promise((resolve) => {
                let failedCount = 0;
                let resolved = false;
                const imgObjects = [];

                const checkSession = setInterval(() => {
                    if (sessionToken !== currentLoadSession && !resolved) {
                        resolved = true;
                        clearInterval(checkSession);
                        imgObjects.forEach(img => img.src = ''); 
                        resolve(null);
                    }
                }, 100);

                IMAGE_EXTENSIONS.forEach(ext => {
                    const testUrl = encodeURI(`${folderPath}/${num}${ext}`);
                    const img = new Image();
                    imgObjects.push(img);
                    
                    img.onload = () => {
                        if (!resolved) {
                            resolved = true;
                            clearInterval(checkSession);
                            resolve(testUrl);
                        }
                    };
                    
                    img.onerror = () => {
                        if (resolved) return;
                        failedCount++;
                        if (failedCount === IMAGE_EXTENSIONS.length) {
                            resolved = true;
                            clearInterval(checkSession);
                            resolve(null);
                        }
                    };
                    img.src = testUrl;
                });
                
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        clearInterval(checkSession);
                        imgObjects.forEach(img => img.src = '');
                        resolve(null);
                    }
                }, 8000); 
            });
        }

        function renderImageCard(src, indexStr) {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            const img = document.createElement('img');
            img.src = src;
            img.decoding = 'async';
            img.loading = 'eager'; 
            card.appendChild(img);
            imageStream.appendChild(card);
        }

        init3DScene();
    </script>
</body>
